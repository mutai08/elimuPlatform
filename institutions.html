<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Institution Details — Effective 40</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Local overrides rely on style.css for main buttons/layout */
    .form-group {
      margin-bottom: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 6px;
      color: white;
      margin-top: 5px;
    }

    label {
      color: #ffdca8;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="main-content">
    <div class="card">
      <h1 style="color: #ffcf9b; text-align:center; margin-bottom:10px;">Select Institution</h1>
      <p style="color: #ccc; text-align:center; margin-bottom:20px;">Enter details for the current examination center.
      </p>

      <form id="institutionForm">
        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" required />
        </div>

        <div class="form-group">
          <label for="knecCode">KNEC Code:</label>
          <input list="knecList" id="knecCode" placeholder="Type or select KNEC Code" required />
          <datalist id="knecList"></datalist>
        </div>

        <div class="form-group">
          <label for="institution">Institution Name:</label>
          <input type="text" id="institution" placeholder="Auto-filled or Type Name" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" required>
              <option value="">--Select--</option>
              <option>SUB-COUNTY</option>
              <option>COUNTY</option>
              <option>EXTRA-COUNTY</option>
              <option>NATIONAL</option>
            </select>
          </div>
          <div class="form-group">
            <label for="zone">Zone:</label>
            <select id="zone" required>
              <option value="">--Select--</option>
              <option>INOI</option>
              <option>MUTIRA</option>
              <option>GAKOIGO</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label for="type">Type:</label>
            <select id="type" required>
              <option value="">--Select--</option>
              <option>Public</option>
              <option>Private</option>
            </select>
          </div>
          <div class="form-group">
            <label for="schoolType">School Type:</label>
            <select id="schoolType" required>
              <option value="">--Select--</option>
              <option>Boys</option>
              <option>Girls</option>
              <option>Mixed</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit" style="width:100%; margin-top:20px;">Submit & Continue <i
            class='bx bx-right-arrow-alt'></i></button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
  <script src="layout.js"></script>

  <script>
    // Global auth and db are now available from auth.js

    // Load schools.json and populate datalist
    let schools = [];
    fetch("schools.json")
      .then(res => res.json())
      .then(data => {
        schools = data;
        const list = document.getElementById("knecList");
        data.forEach(school => {
          const option = document.createElement("option");
          option.value = school.KNEC;
          option.textContent = school.Institution;
          list.appendChild(option);
        });
      })
      .catch(err => console.error("Error loading schools list:", err));

    // Auto-fill Institution name on selecting KNEC
    document.getElementById("knecCode").addEventListener("input", e => {
      const found = schools.find(s => s.KNEC === e.target.value);
      if (found) {
        document.getElementById("institution").value = found.Institution;
      }
    });

    // Handle form submission
    document.getElementById("institutionForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = e.target;
      const data = {
        date: form.date.value,
        knecCode: form.knecCode.value,
        institution: form.institution.value,
        category: form.category.value,
        zone: form.zone.value,
        type: form.type.value,
        schoolType: form.schoolType.value
      };

      await db.ref("institutions").push(data);

      // Save full object
      localStorage.setItem("currentInstitution", JSON.stringify(data));
      // Save individual keys for legacy pages (overall.html, boys.html, girls.html rely on these)
      localStorage.setItem("institution", data.institution);
      localStorage.setItem("knec", data.knecCode);

      // Replaced alert with direct redirect for smoother flow
      window.location.href = "overall.html";
    });
  </script>
</body>

</html>
