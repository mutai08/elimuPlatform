<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Institutions Form</title>
  <style>
    body {
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      color: #fff;
    }
    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px 0;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .navbar a:hover,
    .navbar a.active {
      background-color: #00c3ff;
      box-shadow: 0 0 15px #00c3ff;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
    }
    .form-card {
      background: rgba(0, 0, 0, 0.75);
      padding: 40px;
      border-radius: 15px;
      width: 420px;
      box-shadow: 0 0 25px rgba(0, 195, 255, 0.6);
    }
    .form-card h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #00c3ff;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    input::placeholder {
      color: #ccc;
    }
    select option {
      color: black;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #00c3ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #0086b3;
      box-shadow: 0 0 15px #00c3ff;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="institutions.html" class="active">Institutions</a>
    <a href="overall.html">Overall</a>
    <a href="gender.html">Gender Performance</a>
    <a href="subjects.html">Subjects</a>
    <a href="analytics.html">Analytics Dashboard</a>
  </div>

  <div class="container">
    <div class="form-card">
      <h2>Institution Details</h2>
      <form id="institutionForm">
        <label>Date:</label>
        <input type="date"id="date"required/>

        <label>KNEC Code:</label>
        <input type="text" id="knecCode" placeholder="i.e. 09203402" required/>


        <label>Institution Name:</label>
        <input type="text" id="institution" placeholder="i.e. Kerugoya Boys"required/>

        </select>

        <label>Category:</label>
        <select id="category"required>
          <option value="">-- Select Category --</option>
          <option value="SUB-COUNTY">SUB-COUNTY</option>
          <option value="COUNTY">COUNTY</option>
          <option value="EXTRA-COUNTY">EXTRA-COUNTY</option>
          <option value="NATIONAL">NATIONAL</option>
        </select>

        <label>Zone:</label>
        <select id="zone" required>
          <option value="">-- Select Zone --</option>
          <option value="INOI">INOI</option>
          <option value="MUTIRA">MUTIRA</option>
          <option value="GAKOIGO">GAKOIGO</option>
        </select>

        <label>Type:</label>
        <select id="type" required>
          <option value="">-- Select Type --</option>
          <option value="Public">PUBLIC</option>
          <option value="Private">PRIVATE</option>
        </select>

        <button type="submit">Submit & Continue</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ✅ Your Firebase configuration
    const firebaseConfig = {
   apiKey: "AIzaSyBjwM3I1afnA1hKeuhC4FndPC00suUiKHQ",
  authDomain: "effective40-64d24.firebaseapp.com",
  databaseURL: "https://effective40-64d24-default-rtdb.firebaseio.com",
  projectId: "effective40-64d24",
  storageBucket: "effective40-64d24.firebasestorage.app",
  messagingSenderId: "99811191192",
  appId: "1:99811191192:web:096d9fb7d2958b875523ed",
  measurementId: "G-JVNFJ8JY53"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Form submission
    document.getElementById("institutionForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const institutionData = {
        date: document.getElementById("date").value,
        knecCode: document.getElementById("knecCode").value,
        institution: document.getElementById("institution").value,
        category: document.getElementById("category").value,
        zone: document.getElementById("zone").value,
        type: document.getElementById("type").value,
      };

      try {
        const newRef = push(ref(db, "institutions"));
        await set(newRef, institutionData);
        alert("Institution data submitted successfully!");
        window.location.href = "overall.html";
      } catch (error) {
        console.error("Error saving data:", error);
        alert("Failed to save data. Check console for details.");
      }
    });
  </script>
</body>
</html>
