    </select>

    <button type="submit">Submit</button>
    <button type="button" onclick="goNext()">Next</button>
  </form>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById('institutionForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {
        date: document.getElementById('date').value,
        knecCode: document.getElementById('knecCode').value,
        institution: document.getElementById('institution').value,
        category: document.getElementById('category').value,
        zone: document.getElementById('zone').value,
        type: document.getElementById('type').value
      };
      db.ref("institutions").push(data)
        .then(() => {
          alert("Institution data submitted successfully!");
        })
        .catch((error) => {
          console.error("Error writing to database:", error);
        });
    });

    function goNext() {
      window.location.href = "nextform.html"; // Replace with your next form's filename
    }
  </script>
</body>
