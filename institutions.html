<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Institution Details — Effective 40</title>
  <style>
    body {
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      color: #fff;
    }

    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 0;
      flex-wrap: wrap;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 5px 15px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .navbar a:hover,
    .navbar a.active {
      background-color: #00c3ff;
      box-shadow: 0 0 15px #00c3ff;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      padding: 20px;
    }

    .form-card {
      background: rgba(0, 0, 0, 0.75);
      padding: 35px;
      border-radius: 15px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 25px rgba(0, 195, 255, 0.6);
    }

    .form-card h2 {
      text-align: center;
      color: #00c3ff;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 500;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #00c3ff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0086b3;
      box-shadow: 0 0 15px #00c3ff;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="institutions.html" class="active">Institutions</a>
    <a href="overall.html">Overall</a>
    <a href="gender.html">Gender</a>
    <a href="subjects.html">Subjects</a>
    <a href="analytics.html">Analytics</a>
  </div>

  <div class="container">
    <div class="form-card">
      <h2>Institution Details</h2>
      <form id="institutionForm">
        <label for="date">Date:</label>
        <input type="date" id="date" required />

        <label for="knecCode">KNEC Code:</label>
        <input list="knecList" id="knecCode" placeholder="Type or select KNEC Code" required />
        <datalist id="knecList"></datalist>

        <label for="institution">Institution Name:</label>
        <input type="text" id="institution" placeholder="Auto-filled or Type Name" required />

        <label for="category">Category:</label>
        <select id="category" required>
          <option value="">--Select--</option>
          <option>SUB-COUNTY</option>
          <option>COUNTY</option>
          <option>EXTRA-COUNTY</option>
          <option>NATIONAL</option>
        </select>

        <label for="zone">Zone:</label>
        <select id="zone" required>
          <option value="">--Select--</option>
          <option>INOI</option>
          <option>MUTIRA</option>
          <option>GAKOIGO</option>
        </select>

        <label for="type">Type:</label>
        <select id="type" required>
          <option value="">--Select--</option>
          <option>Public</option>
          <option>Private</option>
        </select>

        <label for="schoolType">School Type:</label>
        <select id="schoolType" required>
          <option value="">--Select--</option>
          <option>Boys</option>
          <option>Girls</option>
          <option>Mixed</option>
        </select>

        <button type="submit">Submit & Continue</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjwM3I1afnA1hKeuhC4FndPC00suUiKHQ",
      authDomain: "effective40-64d24.firebaseapp.com",
      databaseURL: "https://effective40-64d24-default-rtdb.firebaseio.com/",
      projectId: "effective40-64d24",
      storageBucket: "effective40-64d24.firebasestorage.app",
      messagingSenderId: "99811191192",
      appId: "1:99811191192:web:096d9fb7d2958b875523ed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Load schools.json and populate datalist
    let schools = [];
    fetch("schools.json")
      .then(res => res.json())
      .then(data => {
        schools = data;
        const list = document.getElementById("knecList");
        data.forEach(school => {
          const option = document.createElement("option");
          option.value = school.KNEC;
          option.textContent = school.Institution;
          list.appendChild(option);
        });
      })
      .catch(err => console.error("Error loading schools list:", err));

    // Auto-fill Institution name on selecting KNEC
    document.getElementById("knecCode").addEventListener("input", e => {
      const found = schools.find(s => s.KNEC === e.target.value);
      if (found) {
        document.getElementById("institution").value = found.Institution;
      }
    });

    // Handle form submission
    document.getElementById("institutionForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = e.target;
      const data = {
        date: form.date.value,
        knecCode: form.knecCode.value,
        institution: form.institution.value,
        category: form.category.value,
        zone: form.zone.value,
        type: form.type.value,
        schoolType: form.schoolType.value
      };

      await set(push(ref(db, "institutions")), data);

      // Save full object
      localStorage.setItem("currentInstitution", JSON.stringify(data));
      // Save individual keys for legacy pages (overall.html, boys.html, girls.html rely on these)
      localStorage.setItem("institution", data.institution);
      localStorage.setItem("knec", data.knecCode);

      // Replaced alert with direct redirect for smoother flow
      window.location.href = "overall.html";
    });
  </script>
</body>

</html>
