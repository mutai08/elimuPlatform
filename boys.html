<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Boys Performance — Effective 40</title>

  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    /* Layout override */
    .card {
      width: 100%;
      max-width: 980px;
      /* Using slightly darker glass for the forms */
      background: rgba(15, 15, 15, 0.8);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 20px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.02);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .field {
      margin-bottom: 12px
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #ffdca8;
      margin-bottom: 6px
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 14px;
    }

    .field input[disabled] {
      opacity: 0.9;
      color: #ddd;
      background: rgba(255, 255, 255, 0.03)
    }

    .grade-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px;
      border-radius: 10px;
    }

    .grade-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grade-item label {
      font-size: 13px;
      color: #ffdca8
    }

    .grade-item input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      text-align: center;
    }

    .calc-panel {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px;
      border-radius: 10px;
    }

    .calc-item {
      flex: 1;
      min-width: 180px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.35);
      text-align: center
    }

    .calc-item .label {
      font-size: 13px;
      color: #ffdca8
    }

    .calc-item .value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-top: 6px
    }

    .previous-means {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .prev-item {
      flex: 1;
      min-width: 120px
    }

    .prev-item input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      border: none;
      color: #fff
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr
      }

      .card {
        padding: 18px
      }
    }
  </style>
</head>

<body>

  <div class="main-content">
    <div class="card">
      <h1 style="color:#ffcf9b">Boys’ Performance Entry</h1>
      <p style="font-size:13px;color:#ddd;margin-bottom:20px">Enter grade distribution for boys. You may input 0 where
        applicable.</p>

      <div class="grid">
        <div class="panel">
          <div class="field"><label>KNEC Code</label><input id="knecField" type="text" disabled /></div>
          <div class="field"><label>Institution</label><input id="instField" type="text" disabled /></div>
          <div class="field"><label>Candidates (Boys)</label><input id="entryField" type="number" value="0" disabled />
          </div>
          <div><label>Previous Means (3 years)</label>
            <div class="previous-means">
              <div class="prev-item"><input id="meanYr3" placeholder="2022" type="number" step="0.0001"></div>
              <div class="prev-item"><input id="meanYr2" placeholder="2023" type="number" step="0.0001"></div>
              <div class="prev-item"><input id="meanYr1" placeholder="2024" type="number" step="0.0001"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="grade-grid" id="gradesGrid">
            <!-- Grade Fields -->
          </div>

          <div class="calc-panel">
            <div class="calc-item">
              <div class="label">Total Points</div>
              <div class="value" id="totalPoints">0</div>
            </div>
            <div class="calc-item">
              <div class="label">Current Mean</div>
              <div class="value" id="currentMean">0.0000</div>
            </div>
            <div class="calc-item">
              <div class="label">Deviation</div>
              <div class="value" id="deviation">0.0000</div>
            </div>
            <div class="calc-item">
              <div class="label">Mean Grade</div>
              <div class="value" id="meanGrade">E</div>
            </div>
          </div>
        </div>
      </div>

      <div class="submit-row" style="text-align:right;margin-top:16px">
        <button class="btn-submit" id="saveBtn">Save & Continue</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="auth.js"></script>
  <script src="layout.js"></script>

  <script>
    // db and auth are initialized in auth.js

    // Grades setup
    const grades = ["A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "E", "X", "Y", "Z"];
    const grid = document.getElementById("gradesGrid");
    grades.forEach(g => {
      const div = document.createElement("div");
      div.className = "grade-item";
      div.innerHTML = `<label>${g}</label><input type="number" id="g${g.replace('+', 'plus').replace('-', 'minus')}" value="0" min="0">`;
      grid.appendChild(div);
    });

    // Grade weights
    const weightMap = { A: 12, "Aminus": 11, "Bplus": 10, B: 9, "Bminus": 8, "Cplus": 7, C: 6, "Cminus": 5, "Dplus": 4, D: 3, "Dminus": 2, E: 1, X: 0, Y: 0, Z: 0 };

    // Autofill institution details
    const savedKnec = localStorage.getItem('knec') || 'unknown';
    const savedInst = localStorage.getItem('institution') || '';

    document.getElementById('instField').value = savedInst;
    document.getElementById('knecField').value = savedKnec;

    function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

    function recalc() {
      let totalPts = 0, totalCand = 0;
      grades.forEach(g => {
        const id = "g" + g.replace('+', 'plus').replace('-', 'minus');
        const val = num(document.getElementById(id).value);
        if (["X", "Y", "Z"].includes(g) === false) totalCand += val;
        totalPts += val * (weightMap[g.replace('+', 'plus').replace('-', 'minus')] || 0);
      });
      document.getElementById('entryField').value = totalCand;
      const mean = totalCand > 0 ? (totalPts / totalCand) : 0;
      const dev = mean - num(document.getElementById('meanYr1').value);
      document.getElementById('totalPoints').textContent = totalPts;
      document.getElementById('currentMean').textContent = mean.toFixed(4);
      document.getElementById('deviation').textContent = dev.toFixed(4);

      let grade = 'E';
      if (mean >= 11.5) grade = 'A';
      else if (mean >= 10.5) grade = 'A-';
      else if (mean >= 9.5) grade = 'B+';
      else if (mean >= 8.5) grade = 'B';
      else if (mean >= 7.5) grade = 'B-';
      else if (mean >= 6.5) grade = 'C+';
      else if (mean >= 5.5) grade = 'C';
      else if (mean >= 4.5) grade = 'C-';
      else if (mean >= 3.5) grade = 'D+';
      else if (mean >= 2.5) grade = 'D';
      else if (mean >= 1.5) grade = 'D-';
      document.getElementById('meanGrade').textContent = grade;
    }
    document.querySelectorAll('input[type="number"]').forEach(i => i.addEventListener('input', recalc));

    // KEY GENERATION
    const cleanKnec = savedKnec.replace(/[^a-zA-Z0-9]/g, "");
    const currentYear = new Date().getFullYear();
    const docId = `${cleanKnec}_${currentYear}`;

    // LOAD EXISTING DATA
    function loadData() {
      if (!cleanKnec || cleanKnec === 'unknown') return;

      db.ref('boysPerformance/' + docId).once('value').then(snapshot => {
        const data = snapshot.val();
        if (data) {
          // Populate Grades
          if (data.grades) {
            grades.forEach(g => {
              const id = "g" + g.replace('+', 'plus').replace('-', 'minus');
              if (data.grades[id] !== undefined) {
                document.getElementById(id).value = data.grades[id];
              }
            });
          }

          // Populate Previous Means
          if (data.previousMeans) {
            if (data.previousMeans.threeYearsAgo) document.getElementById('meanYr3').value = data.previousMeans.threeYearsAgo;
            if (data.previousMeans.twoYearsAgo) document.getElementById('meanYr2').value = data.previousMeans.twoYearsAgo;
            if (data.previousMeans.lastYear) document.getElementById('meanYr1').value = data.previousMeans.lastYear;
          }

          recalc(); // Update totals
          console.log("Existing data loaded for edit.");
        }
      }).catch(err => console.error("Error loading data:", err));
    }

    // Call load immediately
    loadData();

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const knec = document.getElementById('knecField').value;
      const inst = document.getElementById('instField').value;
      const entry = num(document.getElementById('entryField').value);

      const payload = {
        knec, institution: inst, entry,
        totalPoints: num(document.getElementById('totalPoints').textContent),
        currentMean: num(document.getElementById('currentMean').textContent),
        deviation: num(document.getElementById('deviation').textContent),
        meanGrade: document.getElementById('meanGrade').textContent,
        previousMeans: {
          threeYearsAgo: num(document.getElementById('meanYr3').value),
          twoYearsAgo: num(document.getElementById('meanYr2').value),
          lastYear: num(document.getElementById('meanYr1').value)
        },
        grades: Object.fromEntries(grades.map(g => ["g" + g.replace('+', 'plus').replace('-', 'minus'), num(document.getElementById("g" + g.replace('+', 'plus').replace('-', 'minus')).value)])),
        year: currentYear,
        updatedAt: new Date().toISOString()
      };

      try {
        await db.ref("boysPerformance/" + docId).set(payload);
        window.location.href = "girls.html";
      } catch (e) { alert("Error: " + e.message); }
    });


  </script>
</body>

</html>
