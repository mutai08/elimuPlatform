<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Effective-40</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>
  <div class="wrapper">
    <nav class="nav">
      <div class="nav-logo">
        <p>MoE.</p>
      </div>
      <div class="nav-menu" id="navMenu">
        <ul>
          <li><a href="index.html" class="link active">Home</a></li>
        </ul>
      </div>
      <div class="nav-button">
        <button class="btn white-btn" id="loginBtn" onclick="login()">Sign In</button>
        <button class="btn" id="registerBtn" onclick="register()">Sign Up</button>
      </div>
      <div class="nav-menu-btn">
        <i class="bx bx-menu" onclick="myMenuFunction()"></i>
      </div>
    </nav>

    <!-- Form box -->
    <div class="form-box">

      <!-- LOGIN -->
      <div class="login-container" id="login">
        <div class="top">
          <span>Don't have an account? <a href="#" onclick="register()">Sign Up</a></span>
          <header>Login</header>
        </div>

        <div class="input-box">
          <input type="email" id="loginEmail" class="input-field" placeholder="Email" required>
          <i class="bx bx-user"></i>
        </div>

        <div class="input-box">
          <input type="password" id="loginPassword" class="input-field" placeholder="Password" required>
          <i class="bx bx-lock-alt"></i>
        </div>

        <div id="loginMessage" style="color:red; font-size: 14px;"></div>

        <div class="input-box">
          <input type="button" class="submit" value="Sign In" id="loginSubmit">
        </div>
      </div>

      <!-- REGISTER -->
      <div class="register-container" id="register">
        <div class="top">
          <span>Have an account? <a href="#" onclick="login()">Login</a></span>
          <header>Sign Up</header>
        </div>

        <div class="two-forms">
          <div class="input-box">
            <input type="text" class="input-field" placeholder="Firstname">
            <i class="bx bx-user"></i>
          </div>

          <div class="input-box">
            <input type="text" class="input-field" placeholder="Lastname">
            <i class="bx bx-user"></i>
          </div>
        </div>

        <div class="input-box">
          <input type="email" id="registerEmail" class="input-field" placeholder="Email" required>
          <i class="bx bx-envelope"></i>
        </div>

        <div class="input-box">
          <input type="password" id="registerPassword" class="input-field" placeholder="Password" required>
          <i class="bx bx-lock-alt"></i>
        </div>

        <div id="registerMessage" style="color:red; font-size: 14px;"></div>

        <div class="input-box">
          <input type="button" class="submit" value="Register" id="registerSubmit">
        </div>
      </div>

    </div>
  </div>

  <!-- Menu toggle -->
  <script>
    function myMenuFunction() {
      var i = document.getElementById("navMenu");
      if (i.className === "nav-menu") {
        i.className += " responsive";
      } else {
        i.className = "nav-menu";
      }
    }
  </script>

  <!-- Form switching -->
  <script>
    var a = document.getElementById("loginBtn");
    var b = document.getElementById("registerBtn");
    var x = document.getElementById("login");
    var y = document.getElementById("register");

    function login() {
      x.style.left = "4px";
      y.style.right = "-520px";
      a.className += " white-btn";
      b.className = "btn";
      x.style.opacity = 1;
      y.style.opacity = 0;
    }

    function register() {
      x.style.left = "-510px";
      y.style.right = "5px";
      a.className = "btn";
      b.className += " white-btn";
      x.style.opacity = 0;
      y.style.opacity = 1;
    }
  </script>

  <!-- Firebase Auth Logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjwM3I1afnA1hKeuhC4FndPC00suUiKHQ",
      authDomain: "effective40-64d24.firebaseapp.com",
      databaseURL: "https://effective40-64d24-default-rtdb.firebaseio.com",
      projectId: "effective40-64d24",
      storageBucket: "effective40-64d24.firebasestorage.app",
      messagingSenderId: "99811191192",
      appId: "1:99811191192:web:096d9fb7d2958b875523ed",
      measurementId: "G-JVNFJ8JY53"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginEmail = document.getElementById('loginEmail');
    const loginPass = document.getElementById('loginPassword');
    const loginBtnSubmit = document.getElementById('loginSubmit');
    const loginMessage = document.getElementById('loginMessage');

    const registerEmail = document.getElementById('registerEmail');
    const registerPass = document.getElementById('registerPassword');
    const registerBtnSubmit = document.getElementById('registerSubmit');
    const registerMessage = document.getElementById('registerMessage');

    // Registration
    registerBtnSubmit.addEventListener('click', (e) => {
      e.preventDefault();
      if (!registerEmail.value || !registerPass.value) {
        registerMessage.textContent = "Please fill in all fields.";
        return;
      }
      auth.createUserWithEmailAndPassword(registerEmail.value, registerPass.value)
        .then(() => {
          registerMessage.style.color = "green";
          registerMessage.textContent = "Registration successful!";
        })
        .catch(error => {
          registerMessage.style.color = "red";
          registerMessage.textContent = error.message;
        });
    });

    // Login
    loginBtnSubmit.addEventListener('click', (e) => {
      e.preventDefault();
      if (!loginEmail.value || !loginPass.value) {
        loginMessage.textContent = "Please enter email and password.";
        return;
      }

      auth.signInWithEmailAndPassword(loginEmail.value, loginPass.value)
        .then(() => {
          loginMessage.style.color = "green";
          loginMessage.textContent = "Login successful!";
          setTimeout(() => {
            window.location.href = "institutions.html";
          }, 1000);
        })
        .catch(error => {
          loginMessage.style.color = "red";
          loginMessage.textContent = error.message;
        });
    });

    // PROTECTED PAGE LOGIC
    auth.onAuthStateChanged(user => {
      const protectedPages = [
        "institutions.html",
        "boys.html",
        "girls.html",
        "overall.html"
        ];

      const page = window.location.pathname.split("/").pop();

      // If user is NOT logged in and page is protected → redirect to login
      if (!user && protectedPages.includes(page)) {
        window.location.href = "index.html";
      }

      // No auto-redirect from index.html anymore ✔
    });
  </script>

</body>
</html>
