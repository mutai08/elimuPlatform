<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Ludiflex | Login & Registration</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="wrapper">
    <nav class="nav">
      <div class="nav-logo">
        <p>Ministry Of Education.</p>
      </div>
      <div class="nav-menu" id="navMenu">
        <ul>
          <li><a href="#" class="link active">Home</a></li>
          <li><a href="#" class="link">Institutions</a></li>
          <li><a href="#" class="link">Overall</a></li>
          <li><a href="#" class="link">Gender</a></li>
          <li><a href="#" class="link">Subjects</a></li>
          <li><a href="#" class="link">Analytics Dashboard</a></li>
        </ul>
      </div>
      <div class="nav-button">
        <button class="btn white-btn" id="loginBtn" onclick="login()">Sign In</button>
        <button class="btn" id="registerBtn" onclick="register()">Sign Up</button>
      </div>
      <div class="nav-menu-btn">
        <i class="bx bx-menu" onclick="myMenuFunction()"></i>
      </div>
    </nav>

    <!-- Form box -->
    <div class="form-box">
      <!-- Login form -->
      <div class="login-container" id="login">
        <div class="top">
          <span>Don't have an account? <a href="#" onclick="register()">Sign Up</a></span>
          <header>Login</header>
        </div>
        <div class="input-box">
          <input type="text" id="loginEmail" class="input-field" placeholder="Username or Email">
          <i class="bx bx-user"></i>
        </div>
        <div class="input-box">
          <input type="password" id="loginPassword" class="input-field" placeholder="Password">
          <i class="bx bx-lock-alt"></i>
        </div>
        <div class="input-box">
          <input type="button" class="submit" value="Sign In" id="loginSubmit">
        </div>
        <div class="two-col">
          <div class="one">
            <input type="checkbox" id="login-check">
            <label for="login-check"> Remember Me</label>
          </div>
          <div class="two">
            <label><a href="#">Forgot password?</a></label>
          </div>
        </div>
      </div>

      <!-- Registration form -->
      <div class="register-container" id="register">
        <div class="top">
          <span>Have an account? <a href="#" onclick="login()">Login</a></span>
          <header>Sign Up</header>
        </div>
        <div class="two-forms">
          <div class="input-box">
            <input type="text" class="input-field" placeholder="Firstname">
            <i class="bx bx-user"></i>
          </div>
          <div class="input-box">
            <input type="text" class="input-field" placeholder="Lastname">
            <i class="bx bx-user"></i>
          </div>
        </div>
        <div class="input-box">
          <input type="text" id="registerEmail" class="input-field" placeholder="Email">
          <i class="bx bx-envelope"></i>
        </div>
        <div class="input-box">
          <input type="password" id="registerPassword" class="input-field" placeholder="Password">
          <i class="bx bx-lock-alt"></i>
        </div>
        <div class="input-box">
          <input type="button" class="submit" value="Register" id="registerSubmit">
        </div>
        <div class="two-col">
          <div class="one">
            <input type="checkbox" id="register-check">
            <label for="register-check"> Remember Me</label>
          </div>
          <div class="two">
            <label><a href="#">Terms & conditions</a></label>
          </div>
        </div>
      </div>
    </div>

    <!-- Authenticated user section -->
    <div id="mainContent" style="display: none; text-align: center; margin-top: 50px;">
      <h1>Welcome, <span id="userEmail"></span>!</h1>
      <button onclick="logout()">Log Out</button>
    </div>
  </div>

  <!-- Menu toggle script -->
  <script>
    function myMenuFunction() {
      var i = document.getElementById("navMenu");
      if (i.className === "nav-menu") {
        i.className += " responsive";
      } else {
        i.className = "nav-menu";
      }
    }
  </script>

  <!-- Form switch script -->
  <script>
    var a = document.getElementById("loginBtn");
    var b = document.getElementById("registerBtn");
    var x = document.getElementById("login");
    var y = document.getElementById("register");

    function login() {
      x.style.left = "4px";
      y.style.right = "-520px";
      a.className += " white-btn";
      b.className = "btn";
      x.style.opacity = 1;
      y.style.opacity = 0;
    }

    function register() {
      x.style.left = "-510px";
      y.style.right = "5px";
      a.className = "btn";
      b.className += " white-btn";
      x.style.opacity = 0;
      y.style.opacity = 1;
    }
  </script>

  <!-- Firebase logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCc3h36MhpXgKTxZzZ9p5y3zENdZiQ8RCU",
      authDomain: "effective40-64d24.firebaseapp.com",
      projectId: "effective40-64d24",
      appId: "1:99811191192:web:c4a2826fa43007415523ed"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Select DOM elements
    const loginEmail = document.getElementById('loginEmail');
    const loginPass = document.getElementById('loginPassword');
    const loginBtnSubmit = document.getElementById('loginSubmit');

    const registerEmail = document.getElementById('registerEmail');
    const registerPass = document.getElementById('registerPassword');
    const registerBtnSubmit = document.getElementById('registerSubmit');

    const userEmailDisplay = document.getElementById('userEmail');
    const mainContent = document.getElementById('mainContent');
    const formBox = document.querySelector('.form-box');

    // Register
    registerBtnSubmit.addEventListener('click', (e) => {
      e.preventDefault();
      auth.createUserWithEmailAndPassword(registerEmail.value, registerPass.value)
        .then(userCredential => {
          alert('Registration successful!');
        })
        .catch(error => alert(error.message));
    });

    // Login
    loginBtnSubmit.addEventListener('click', (e) => {
      e.preventDefault();
      auth.signInWithEmailAndPassword(loginEmail.value, loginPass.value)
        .then(userCredential => {
          alert('Login successful!');
        })
        .catch(error => alert(error.message));
    });

    // Auth state listener
    auth.onAuthStateChanged(user => {
      if (user) {
        formBox.style.display = 'none';
        mainContent.style.display = 'block';
        userEmailDisplay.textContent = user.email;
      } else {
        formBox.style.display = 'block';
        mainContent.style.display = 'none';
      }
    });

    // Logout
    function logout() {
      auth.signOut()
        .then(() => alert('You have logged out.'))
        .catch(error => alert(error.message));
    }
  </script>
</body>
</html>
