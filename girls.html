<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Girls Performance — Effective 40</title>

  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: "Poppins", sans-serif;
      background: url('background.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
    }

    nav {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 200;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    .nav-left {
      font-weight: 700;
      font-size: 20px;
      color: #fff
    }

    .nav-links {
      display: flex;
      gap: 18px;
      align-items: center
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 6px;
      transition: .22s
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ff9800;
      text-shadow: 0 0 10px #ff9800;
      background: rgba(255, 255, 255, 0.03)
    }

    .btn-logout {
      background: #ff9800;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-logout:hover {
      transform: translateY(-1px)
    }

    .page-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 120px 18px 40px
    }

    .card {
      width: 100%;
      max-width: 980px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 20px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.02);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .field {
      margin-bottom: 12px
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #ffdca8;
      margin-bottom: 6px
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 14px;
    }

    .field input[disabled] {
      opacity: 0.9;
      color: #ddd;
      background: rgba(255, 255, 255, 0.03)
    }

    .grade-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px;
      border-radius: 10px;
    }

    .grade-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grade-item label {
      font-size: 13px;
      color: #ffdca8
    }

    .grade-item input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      text-align: center;
    }

    .calc-panel {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px;
      border-radius: 10px;
    }

    .calc-item {
      flex: 1;
      min-width: 180px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.35);
      text-align: center
    }

    .calc-item .label {
      font-size: 13px;
      color: #ffdca8
    }

    .calc-item .value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-top: 6px
    }

    .previous-means {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .prev-item {
      flex: 1;
      min-width: 120px
    }

    .prev-item input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      border: none;
      color: #fff
    }

    .btn-submit {
      background: #ff9800;
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit:hover {
      transform: scale(1.02)
    }

    .btn-back {
      background: #ccc;
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 10px;
    }

    .btn-back:hover {
      transform: scale(1.02)
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr
      }

      .card {
        padding: 18px
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-left">Effective 40</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="institutions.html">Institutions</a>
      <a href="overall.html">Overall</a>
      <a href="girls.html" class="active">Girls Performance</a>
      <a href="subjects.html">Subjects</a>
      <a href="analytics.html">Analytics</a>
    </div>
    <button class="btn-logout" id="logoutBtn">Logout</button>
  </nav>

  <div class="page-wrap">
    <div class="card">
      <h1 style="color:#ffcf9b">Girls’ Performance Entry</h1>
      <p style="font-size:13px;color:#ddd;margin-bottom:20px">Enter grade distribution for girls. You may input 0 where
        applicable.</p>

      <div class="grid">
        <div class="panel">
          <div class="field"><label>KNEC Code</label><input id="knecField" type="text" disabled /></div>
          <div class="field"><label>Institution</label><input id="instField" type="text" disabled /></div>
          <div class="field"><label>Candidates (Girls)</label><input id="entryField" type="number" value="0" disabled />
          </div>
          <div><label>Previous Means (3 years)</label>
            <div class="previous-means">
              <div class="prev-item"><input id="meanYr3" placeholder="3 yrs ago" type="number" step="0.0001"></div>
              <div class="prev-item"><input id="meanYr2" placeholder="2 yrs ago" type="number" step="0.0001"></div>
              <div class="prev-item"><input id="meanYr1" placeholder="Last year" type="number" step="0.0001"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="grade-grid" id="gradesGrid">
            <!-- Grade Fields will load here -->
          </div>

          <div class="calc-panel">
            <div class="calc-item">
              <div class="label">Total Points</div>
              <div class="value" id="totalPoints">0</div>
            </div>
            <div class="calc-item">
              <div class="label">Current Mean</div>
              <div class="value" id="currentMean">0.0000</div>
            </div>
            <div class="calc-item">
              <div class="label">Deviation</div>
              <div class="value" id="deviation">0.0000</div>
            </div>
            <div class="calc-item">
              <div class="label">Mean Grade</div>
              <div class="value" id="meanGrade">E</div>
            </div>
          </div>
        </div>
      </div>

      <div class="submit-row" style="text-align:right;margin-top:16px">
        <button class="btn-back" id="backBtn">← Back to Boys</button>
        <button class="btn-submit" id="saveBtn">Save & Continue</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // Firebase setup
    const firebaseConfig = {
      apiKey: "AIzaSyBjwM3I1afnA1hKeuhC4FndPC00suUiKHQ",
      authDomain: "effective40-64d24.firebaseapp.com",
      databaseURL: "https://effective40-64d24-default-rtdb.firebaseio.com",
      projectId: "effective40-64d24",
      storageBucket: "effective40-64d24.firebasestorage.app",
      messagingSenderId: "99811191192",
      appId: "1:99811191192:web:096d9fb7d2958b875523ed"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // Grades setup
    const grades = ["A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "E", "X", "Y", "Z"];
    const grid = document.getElementById("gradesGrid");
    grades.forEach(g => {
      const div = document.createElement("div");
      div.className = "grade-item";
      div.innerHTML = `<label>${g}</label><input type="number" id="g${g.replace('+', 'plus').replace('-', 'minus')}" value="0" min="0">`;
      grid.appendChild(div);
    });

    // Grade weights
    const weightMap = { A: 12, "Aminus": 11, "Bplus": 10, B: 9, "Bminus": 8, "Cplus": 7, C: 6, "Cminus": 5, "Dplus": 4, D: 3, "Dminus": 2, E: 1, X: 0, Y: 0, Z: 0 };

    // Autofill institution details
    document.getElementById('instField').value = localStorage.getItem('institution') || '';
    document.getElementById('knecField').value = localStorage.getItem('knec') || '';

    function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

    function recalc() {
      let totalPts = 0, totalCand = 0;
      grades.forEach(g => {
        const id = "g" + g.replace('+', 'plus').replace('-', 'minus');
        const val = num(document.getElementById(id).value);
        if (["X", "Y", "Z"].includes(g) === false) totalCand += val;
        totalPts += val * (weightMap[g.replace('+', 'plus').replace('-', 'minus')] || 0);
      });
      document.getElementById('entryField').value = totalCand;
      const mean = totalCand > 0 ? (totalPts / totalCand) : 0;
      const dev = mean - num(document.getElementById('meanYr1').value);
      document.getElementById('totalPoints').textContent = totalPts;
      document.getElementById('currentMean').textContent = mean.toFixed(4);
      document.getElementById('deviation').textContent = dev.toFixed(4);

      let grade = 'E';
      if (mean >= 11.5) grade = 'A';
      else if (mean >= 10.5) grade = 'A-';
      else if (mean >= 9.5) grade = 'B+';
      else if (mean >= 8.5) grade = 'B';
      else if (mean >= 7.5) grade = 'B-';
      else if (mean >= 6.5) grade = 'C+';
      else if (mean >= 5.5) grade = 'C';
      else if (mean >= 4.5) grade = 'C-';
      else if (mean >= 3.5) grade = 'D+';
      else if (mean >= 2.5) grade = 'D';
      else if (mean >= 1.5) grade = 'D-';
      document.getElementById('meanGrade').textContent = grade;
    }
    document.querySelectorAll('input[type="number"]').forEach(i => i.addEventListener('input', recalc));

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const knec = document.getElementById('knecField').value;
      const inst = document.getElementById('instField').value;
      const entry = num(document.getElementById('entryField').value);

      const payload = {
        knec, institution: inst, entry,
        totalPoints: num(document.getElementById('totalPoints').textContent),
        currentMean: num(document.getElementById('currentMean').textContent),
        deviation: num(document.getElementById('deviation').textContent),
        meanGrade: document.getElementById('meanGrade').textContent,
        previousMeans: {
          threeYearsAgo: num(document.getElementById('meanYr3').value),
          twoYearsAgo: num(document.getElementById('meanYr2').value),
          lastYear: num(document.getElementById('meanYr1').value)
        },
        grades: Object.fromEntries(grades.map(g => ["g" + g.replace('+', 'plus').replace('-', 'minus'), num(document.getElementById("g" + g.replace('+', 'plus').replace('-', 'minus')).value)])),
        year: new Date().getFullYear(),
        createdAt: new Date().toISOString()
      };

      try {
        await db.ref("girlsPerformance").push(payload);
        window.location.href = "subjects.html";
      } catch (e) { alert("Error: " + e.message); }
    });

    // Back and Logout actions
    document.getElementById("backBtn").addEventListener("click", () => window.location.href = "boys.html");
    document.getElementById("logoutBtn").addEventListener("click", () => {
      auth.signOut().then(() => location.href = "index.html");
    });
  </script>
</body>

</html>
