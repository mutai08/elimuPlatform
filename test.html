<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 15px;
        }
        .chart-container {
            position: relative;
            height: 350px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h2 class="text-center mb-4">📊 School Performance Analytics Dashboard</h2>

        <div class="mb-3 p-3 bg-white shadow-sm rounded">
            <h5>Filter by School</h5>
            <select id="schoolSelect" class="form-select">
                <option value="">-- Select School --</option>
            </select>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="text-center">Overall Mean Trend</h5>
                    <div class="chart-container">
                        <canvas id="overallTrendChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="text-center">Subject Performance Comparison</h5>
                    <div class="chart-container">
                        <canvas id="subjectComparisonChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
// ==========================
//  Firebase Config
// ==========================
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_PROJECT_ID",
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Load list of schools
function loadSchools() {
    firebase.database().ref("schools").once("value", snapshot => {
        let select = document.getElementById("schoolSelect");
        select.innerHTML = '<option value="">-- Select School --</option>';

        snapshot.forEach(child => {
            let d = child.val();
            let opt = document.createElement("option");
            opt.value = d.KNEC;
            opt.textContent = d.Institution;
            select.appendChild(opt);
        });
    });
}

loadSchools();

// Listen for school selection
const schoolSelect = document.getElementById("schoolSelect");
schoolSelect.addEventListener("change", () => {
    let knec = schoolSelect.value;
    if (knec) loadAnalytics(knec);
});

// ==========================
// Fetch and Plot Charts
// ==========================
function loadAnalytics(knec) {
    const subjectRef = firebase.database().ref(`schools/${knec}/subjects`);

    subjectRef.once("value", snapshot => {
        let years = ["2024", "2023", "2022"]; // Fixed sequence
        let means = { "2024": [], "2023": [], "2022": [] };
        let subjectNames = [];

        snapshot.forEach(child => {
            const data = child.val();
            subjectNames.push(data.subjectName);
            means["2024"].push(parseFloat(data.mean2024 || 0));
            means["2023"].push(parseFloat(data.mean2023 || 0));
            means["2022"].push(parseFloat(data.mean2022 || 0));
        });

        drawOverallTrend(years, means);
        drawSubjectComparison(subjectNames, means);
    });
}

let chart1, chart2;

function drawOverallTrend(years, means) {
    if (chart1) chart1.destroy();
    let ctx = document.getElementById("overallTrendChart").getContext("2d");

    chart1 = new Chart(ctx, {
        type: "line",
        data: {
            labels: years,
            datasets: [
                {
                    label: "Average Mean Score",
                    data: years.map(y => avg(means[y])),
                    borderWidth: 3,
                }
            ]
        },
        options: { responsive: true }
    });
}

function drawSubjectComparison(subjectNames, means) {
    if (chart2) chart2.destroy();
    let ctx = document.getElementById("subjectComparisonChart").getContext("2d");

    chart2 = new Chart(ctx, {
        type: "bar",
        data: {
            labels: subjectNames,
            datasets: [
                { label: "2024", data: means["2024"], borderWidth: 1 },
                { label: "2023", data: means["2023"], borderWidth: 1 },
                { label: "2022", data: means["2022"], borderWidth: 1 }
            ]
        },
        options: { responsive: true }
    });
}

function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
</script>

</body>
</html>
