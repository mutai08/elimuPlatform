<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Institution Details</title>
  <style>
    body {
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      color: #fff;
    }
    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 0;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .navbar a:hover, .navbar a.active {
      background-color: #00c3ff;
      box-shadow: 0 0 15px #00c3ff;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
    }
    .form-card {
      background: rgba(0,0,0,0.75);
      padding: 40px;
      border-radius: 15px;
      width: 420px;
      box-shadow: 0 0 25px rgba(0,195,255,0.6);
    }
    .form-card h2 { text-align: center; color: #00c3ff; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    input:focus, select:focus {
      outline: 2px solid #00c3ff;
      box-shadow: 0 0 10px #00c3ff;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #00c3ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0086b3;
      box-shadow: 0 0 15px #00c3ff;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="institutions.html" class="active">Institutions</a>
    <a href="overall.html">Overall</a>
    <a href="boys.html">Boys</a>
    <a href="girls.html">Girls</a>
    <a href="subjects.html">Subjects</a>
    <a href="analytics.html">Analytics</a>
  </div>

  <div class="container">
    <div class="form-card">
      <h2>Institution Details</h2>
      <form id="institutionForm">
        <label>Date:</label>
        <input type="date" id="date" required />

        <label>KNEC Code:</label>
        <input list="knecList" id="knecCode" placeholder="Select or type KNEC code" required />
        <datalist id="knecList"></datalist>

        <label>Institution Name:</label>
        <input list="institutionList" id="institution" placeholder="Select or type Institution" required />
        <datalist id="institutionList"></datalist>

        <label>Category:</label>
        <select id="category" required>
          <option value="">--Select--</option>
          <option>SUB-COUNTY</option>
          <option>COUNTY</option>
          <option>EXTRA-COUNTY</option>
          <option>NATIONAL</option>
        </select>

        <label>Zone:</label>
        <select id="zone" required>
          <option value="">--Select--</option>
          <option>INOI</option>
          <option>MUTIRA</option>
          <option>GAKOIGO</option>
        </select>

        <label>Type:</label>
        <select id="type" required>
          <option value="">--Select--</option>
          <option>Public</option>
          <option>Private</option>
        </select>

        <label>School Type:</label>
        <select id="schoolType" required>
          <option value="">--Select--</option>
          <option>Boys</option>
          <option>Girls</option>
          <option>Mixed</option>
        </select>

        <button type="submit">Submit & Continue</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjwM3I1afnA1hKeuhC4FndPC00suUiKHQ",
      authDomain: "effective40-64d24.firebaseapp.com",
      databaseURL: "https://effective40-64d24-default-rtdb.firebaseio.com",
      projectId: "effective40-64d24",
      storageBucket: "effective40-64d24.firebasestorage.app",
      messagingSenderId: "99811191192",
      appId: "1:99811191192:web:096d9fb7d2958b875523ed",
      measurementId: "G-JVNFJ8JY53"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let institutionsData = {};

    // Load existing schools into datalist
    async function loadInstitutions() {
      const snapshot = await get(ref(db, "institutions"));
      if (snapshot.exists()) {
        institutionsData = snapshot.val();
        const institutionList = document.getElementById("institutionList");
        const knecList = document.getElementById("knecList");

        Object.values(institutionsData).forEach((school) => {
          const instOption = document.createElement("option");
          instOption.value = school.institution;
          institutionList.appendChild(instOption);

          const knecOption = document.createElement("option");
          knecOption.value = school.knecCode;
          knecList.appendChild(knecOption);
        });
      }
    }
    loadInstitutions();

    // Auto-fill institution when KNEC is selected
    document.getElementById("knecCode").addEventListener("input", () => {
      const knecValue = document.getElementById("knecCode").value.trim();
      const school = Object.values(institutionsData).find(s => s.knecCode === knecValue);
      if (school) {
        document.getElementById("institution").value = school.institution;
        document.getElementById("category").value = school.category;
        document.getElementById("zone").value = school.zone;
        document.getElementById("type").value = school.type;
        document.getElementById("schoolType").value = school.schoolType;
      }
    });

    // Save data to Firebase
    document.getElementById("institutionForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        date: date.value,
        knecCode: knecCode.value,
        institution: institution.value,
        category: category.value,
        zone: zone.value,
        type: type.value,
        schoolType: schoolType.value
      };

      await set(push(ref(db, "institutions")), data);
      localStorage.setItem("currentInstitution", JSON.stringify(data));

      alert("Institution saved successfully!");
      window.location.href = "overall.html";
    });
  </script>
</body>
</html>
