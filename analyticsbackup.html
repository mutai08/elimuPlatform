<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Analytics Dashboard — Effective 40</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #ff9800;
            --bg-glass: rgba(0, 0, 0, 0.65);
            --bg-panel: rgba(255, 255, 255, 0.03);
            --text-muted: #ddd;
            --text-label: #ffdca8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Specific dashboard styles */
        .dashboard {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin: 0 auto;
        }

        .page-title {
            margin-bottom: 24px;
            color: var(--primary);
            text-align: center;
            font-size: 28px;
        }

        .section-card {
            background: var(--bg-glass);
            border-radius: 14px;
            padding: 26px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .section-header {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        /* GRID LAYOUTS */
        .viz-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* TABLE */
        .data-table-wrap {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-label);
            font-weight: 600;
            padding: 12px;
            text-align: left;
        }

        td {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            font-size: 14px;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .rank-col {
            width: 60px;
            font-weight: 700;
            color: var(--primary);
        }

        .score-col {
            font-weight: 600;
            text-align: right;
        }

        /* CHART WRAPPERS */
        .chart-box {
            background: var(--bg-panel);
            border-radius: 10px;
            padding: 14px;
            position: relative;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
        }

        select:focus {
            border-color: var(--primary);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width: 900px) {
            .viz-grid {
                grid-template-columns: 1fr;
            }

            .chart-box {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- LOADING -->
    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div>Loading Analytics...</div>
    </div>

    <div class="main-content">

        <div class="dashboard">
            <h1 class="page-title">Analytics Dashboard</h1>

            <!-- OVERALL PERFORMANCE -->
            <div class="section-card">
                <div class="section-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Overall Performance Ranking</span>
                    <button class="btn-secondary" style="padding:6px 12px; font-size:13px;"
                        onclick="exportTableToExcel('overallTable', 'Overall_Performance')">
                        <i class='bx bxs-download'></i> Export Excel
                    </button>
                </div>

                <!-- STATS SUMMARY (New) -->
                <div class="viz-grid" style="margin-bottom:20px; grid-template-columns: repeat(3, 1fr);">
                    <div class="meta"
                        style="background:var(--bg-panel); padding:15px; border-radius:8px; text-align:center;">
                        <div style="font-size:13px; color:var(--text-label)">Registered Schools</div>
                        <div style="font-size:24px; font-weight:700;" id="statTotalSchools">0</div>
                    </div>
                    <div class="meta"
                        style="background:var(--bg-panel); padding:15px; border-radius:8px; text-align:center;">
                        <div style="font-size:13px; color:var(--text-label)">Top Performer</div>
                        <div style="font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                            id="statTopSchool">-</div>
                    </div>
                    <div class="meta"
                        style="background:var(--bg-panel); padding:15px; border-radius:8px; text-align:center;">
                        <div style="font-size:13px; color:var(--text-label)">Average Mean</div>
                        <div style="font-size:24px; font-weight:700;" id="statAvgMean">0.00</div>
                    </div>
                </div>

                <div class="viz-grid">
                    <!-- Table -->
                    <div>
                        <div class="data-table-wrap">
                            <table id="overallTable">
                                <thead>
                                    <tr>
                                        <!-- Will be filled by JS -->
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                    <!-- Chart -->
                    <div class="chart-box">
                        <canvas id="overallChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- GENDER COMPARISON -->
            <div class="section-card">
                <div class="section-header">Gender Analysis</div>
                <div class="viz-grid">
                    <!-- Boys -->
                    <div>
                        <div
                            style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <h4 style="color:#a3d6ff">Top Boys Schools</h4>
                            <button class="btn-secondary" style="padding:4px 8px; font-size:11px;"
                                onclick="exportTableToExcel('boysTable', 'Boys_Performance')">Export</button>
                        </div>
                        <div class="data-table-wrap" style="max-height: 250px; overflow-y:auto;">
                            <table id="boysTable">
                                <thead></thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                    <!-- Girls -->
                    <div>
                        <div
                            style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <h4 style="color:#ffb3d9">Top Girls Schools</h4>
                            <button class="btn-secondary" style="padding:4px 8px; font-size:11px;"
                                onclick="exportTableToExcel('girlsTable', 'Girls_Performance')">Export</button>
                        </div>
                        <div class="data-table-wrap" style="max-height: 250px; overflow-y:auto;">
                            <table id="girlsTable">
                                <thead></thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SUBJECT PERFORMANCE -->
            <div class="section-card">
                <div class="section-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Subject Rankings</span>
                    <button class="btn-secondary" style="padding:6px 12px; font-size:13px;"
                        onclick="exportTableToExcel('subjectTable', 'Subject_Performance')">
                        <i class='bx bxs-download'></i> Export Excel
                    </button>
                </div>
                <div class="controls">
                    <select id="subjectSelect">
                        <option value="" disabled selected>Select Subject...</option>
                        <option value="101">English</option>
                        <option value="102">Kiswahili</option>
                        <option value="121">Mathematics</option>
                        <option value="231">Biology</option>
                        <option value="232">Physics</option>
                        <option value="233">Chemistry</option>
                        <option value="311">History</option>
                        <option value="312">Geography</option>
                        <option value="313">C.R.E</option>
                        <option value="441">Home Science</option>
                        <option value="442">Art & Design</option>
                        <option value="443">Agriculture</option>
                        <option value="444">Woodwork</option>
                        <option value="445">Metalwork</option>
                        <option value="446">Building & Const.</option>
                        <option value="451">Computer Studies</option>
                        <option value="565">Business Studies</option>
                        <option value="501">French</option>
                        <option value="502">German</option>
                    </select>
                </div>
                <div class="viz-grid">
                    <div class="data-table-wrap">
                        <table id="subjectTable">
                            <thead></thead>
                            <tbody id="subjectTableBody">
                                <tr>
                                    <td colspan="6" style="text-align:center; color:#888;">Select a subject to view
                                        rankings
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="chart-box">
                        <canvas id="subjectChart"></canvas>
                    </div>
                </div>
            </div>

        </div>

    </div> <!-- end main-content -->

    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Firebase Config -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="auth.js"></script>
    <script src="layout.js"></script>

    <script>
        // Export Function
        function exportTableToExcel(tableId, name) {
            const table = document.getElementById(tableId);
            if (!table) return;
            const wb = XLSX.utils.table_to_book(table, { strip: true });
            XLSX.writeFile(wb, `${name}.xlsx`);
        }

        // CONFIG
        // db and auth from auth.js

        let overallData = [];
        let boysData = [];
        let girlsData = [];
        let subjectsData = {};
        let institutionsMap = {}; // knec -> { category, zone, type, ... }

        // INIT
        async function init() {
            try {
                // Fetch all concurrently
                const [ovSnap, boysSnap, girlsSnap, subjSnap, instSnap] = await Promise.all([
                    db.ref('overallPerformance').once('value'),
                    db.ref('boysPerformance').once('value'),
                    db.ref('girlsPerformance').once('value'),
                    db.ref('subjectsPerformance').once('value'),
                    db.ref('institutions').once('value')
                ]);

                // 1. Process Institutions Map
                if (instSnap.exists()) {
                    const raw = instSnap.val();
                    // institutions is a list/object. We map by knecCode or KNEC (fallback)
                    Object.values(raw).forEach(inst => {
                        const code = inst.knecCode || inst.KNEC;
                        if (code) institutionsMap[code] = inst;
                    });
                }

                // 2. Process Overall
                if (ovSnap.exists()) {
                    const raw = ovSnap.val();
                    overallData = Object.values(raw).map(augmentWithInst).sort((a, b) => b.currentMean - a.currentMean);
                }

                // 3. Process Boys
                if (boysSnap.exists()) {
                    const raw = boysSnap.val();
                    boysData = Object.values(raw).map(augmentWithInst).sort((a, b) => b.currentMean - a.currentMean);
                }

                // 4. Process Girls
                if (girlsSnap.exists()) {
                    const raw = girlsSnap.val();
                    girlsData = Object.values(raw).map(augmentWithInst).sort((a, b) => b.currentMean - a.currentMean);
                }

                // 5. Process Subjects
                if (subjSnap.exists()) {
                    subjectsData = subjSnap.val();
                }

                updateStats();
                renderOverall();
                renderBoys();
                renderGirls();

            } catch (err) {
                console.error("Data load error:", err);
                alert("Error loading data from Firebase. Check console.");
            } finally {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 300);
            }
        }

        // Augment data object with institution details if match found
        function augmentWithInst(item) {
            if (!item) return item;
            // ensure item.knec is a string for matching
            const key = String(item.knec || '').trim();

            let match = null;
            if (key && institutionsMap[key]) {
                match = institutionsMap[key];
            }

            // If no match by KNEC, we could try matching by Name roughly? 
            // But let's trust KNEC. 

            if (match) {
                item.category = match.category;
                item.zone = match.zone;
                item.type = match.type;
                // Fallback for institution name if missing in performance record
                // This fixes the issue where institution is saved as empty/nil in performance but exists in inst db
                if (!item.institution || item.institution === 'Unknown' || item.institution.trim() === '') {
                    item.institution = match.institution || match.Institution;
                }
            }
            return item;
        }

        function updateStats() {
            // Total Schools Registered (in institutions DB or overall DB?) -> Use Overall DB count
            const total = overallData.length;
            document.getElementById('statTotalSchools').textContent = total;

            // Top School
            if (total > 0) {
                document.getElementById('statTopSchool').textContent = overallData[0].institution || 'Unknown';
            }

            // Avg Mean of all entered schools
            if (total > 0) {
                const sum = overallData.reduce((acc, c) => acc + (Number(c.currentMean) || 0), 0);
                document.getElementById('statAvgMean').textContent = (sum / total).toFixed(4);
            }
        }

        // Helper to get grade count safely
        function getGrade(item, gradeKey, isSubject = false) {
            // Overall/Boys/Girls use keys like 'gA', 'gAminus'
            // Subjects use keys like 'A', 'A-'
            if (!item || !item.grades) return 0;

            let key = gradeKey;
            if (!isSubject) {
                // Map 'A' -> 'gA', 'A-' -> 'gAminus'
                const map = {
                    'A': 'gA', 'A-': 'gAminus',
                    'B+': 'gBplus', 'B': 'gB', 'B-': 'gBminus',
                    'C+': 'gCplus', 'C': 'gC', 'C-': 'gCminus',
                    'D+': 'gDplus', 'D': 'gD', 'D-': 'gDminus',
                    'E': 'gE'
                };
                key = map[gradeKey] || gradeKey;
            }
            return item.grades[key] || 0;
        }

        const gradeCols = ['A', 'A-', 'B+', 'B', 'B-', 'C+', 'C', 'C-', 'D+', 'D', 'D-', 'E'];

        function buildGradeHeaders() {
            return gradeCols.map(g => `<th style="font-size:11px; padding:4px;">${g}</th>`).join('');
        }

        // UPDATE TABLE HEADERS DYNAMICALLY or STATICALLY
        // Let's replace the HTML content of the tables in the render functions or just update the HTML block above.
        // We will do it in JavaScript to ensure consistency.

        function setTableHeaders(tableId, extraCols = '') {
            const table = document.getElementById(tableId);
            const thead = table.querySelector('thead');
            thead.innerHTML = `
                <tr>
                    <th class="rank-col">#</th>
                    <th>Institution</th>
                    ${extraCols}
                    <th class="score-col">Entry</th>
                    <th class="score-col">Mean</th>
                    ${buildGradeHeaders()}
                </tr>
            `;
        }

        // --- RENDER OVERALL ---
        let overallChartInst = null;
        function renderOverall() {
            setTableHeaders('overallTable', '<th style="font-size:12px;">Cat</th>');

            const tbody = document.querySelector('#overallTable tbody');
            tbody.innerHTML = '';

            // Sort by Mean Desc
            const data = overallData.sort((a, b) => b.currentMean - a.currentMean);

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                const gradeCells = gradeCols.map(g => `<td style="font-size:11px; padding:4px;">${getGrade(item, g, false)}</td>`).join('');

                tr.innerHTML = `
                    <td class="rank-col">${index + 1}</td>
                    <td>
                        <div style="font-weight:600">${item.institution || 'Unknown'}</div>
                    </td>
                    <td style="font-size:12px; color:#aaa;">${item.category || '-'}</td>
                    <td class="score-col">${item.entry}</td>
                    <td class="score-col">${Number(item.currentMean).toFixed(4)}</td>
                    ${gradeCells}
                `;
                tbody.appendChild(tr);
            });

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="18" style="text-align:center;color:#888;">No Data Available</td></tr>`;
                return;
            }

            // Chart (Top 10)
            const top10 = data.slice(0, 10);
            const ctx = document.getElementById('overallChart').getContext('2d');
            if (overallChartInst) overallChartInst.destroy();
            overallChartInst = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: top10.map(d => (d.institution || 'Unknown').substring(0, 15)),
                    datasets: [{
                        label: 'Current Mean',
                        data: top10.map(d => d.currentMean),
                        backgroundColor: 'rgba(255, 152, 0, 0.7)',
                        borderColor: 'rgba(255, 152, 0, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#ddd' } },
                        x: { grid: { display: false }, ticks: { color: '#ccc', font: { size: 10 } } }
                    }
                }
            });
        }

        // --- RENDER BOYS ---
        function renderBoys() {
            setTableHeaders('boysTable');
            const tbody = document.querySelector('#boysTable tbody');
            tbody.innerHTML = '';

            // Filter 0 entry and sort
            const data = boysData
                .filter(item => item.entry > 0)
                .sort((a, b) => b.currentMean - a.currentMean);

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                const gradeCells = gradeCols.map(g => `<td style="font-size:11px; padding:4px;">${getGrade(item, g, false)}</td>`).join('');

                tr.innerHTML = `
                    <td class="rank-col">${index + 1}</td>
                    <td>${item.institution || 'Unknown'}</td>
                    <td class="score-col">${item.entry}</td>
                    <td class="score-col">${Number(item.currentMean).toFixed(4)}</td>
                    ${gradeCells}
                `;
                tbody.appendChild(tr);
            });
            if (data.length === 0) tbody.innerHTML = '<tr><td colspan="17" style="text-align:center;color:#888">No Data (Note: Schools with 0 entry are hidden)</td></tr>';
        }

        // --- RENDER GIRLS ---
        function renderGirls() {
            setTableHeaders('girlsTable');
            const tbody = document.querySelector('#girlsTable tbody');
            tbody.innerHTML = '';

            // Filter 0 entry and sort
            const data = girlsData
                .filter(item => item.entry > 0)
                .sort((a, b) => b.currentMean - a.currentMean);

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                const gradeCells = gradeCols.map(g => `<td style="font-size:11px; padding:4px;">${getGrade(item, g, false)}</td>`).join('');

                tr.innerHTML = `
                    <td class="rank-col">${index + 1}</td>
                    <td>${item.institution || 'Unknown'}</td>
                    <td class="score-col">${item.entry}</td>
                    <td class="score-col">${Number(item.currentMean).toFixed(4)}</td>
                    ${gradeCells}
                `;
                tbody.appendChild(tr);
            });
            if (data.length === 0) tbody.innerHTML = '<tr><td colspan="17" style="text-align:center;color:#888">No Data (Note: Schools with 0 entry are hidden)</td></tr>';
        }

        // --- SUBJECT FILTER ---
        let subjectChartInst = null;
        document.getElementById('subjectSelect').addEventListener('change', (e) => {
            const code = e.target.value;
            renderSubject(code);
        });

        function renderSubject(code) {
            if (!code) return;

            setTableHeaders('subjectTable'); // Update headers

            let items = [];

            // Parse subjectsData
            // subjectsData structure: { "schoolDocId": { "subjectCode": { data... } } }
            // OR if subjects.html saves as: db.ref(...).set(data), then it is:
            // subjectsPerformance / docId / subjectCode / { ... }

            // So subjectsData keys are docIds.
            Object.keys(subjectsData).forEach(docId => {
                const schoolSubjects = subjectsData[docId];
                if (schoolSubjects && schoolSubjects[code]) {
                    // This IS the record
                    const record = schoolSubjects[code];
                    items.push(augmentWithInst(record));
                }
            });

            // Sort desc by Mean
            items.sort((a, b) => b.currentMean - a.currentMean);

            // Table
            const tbody = document.getElementById('subjectTableBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="17" style="text-align:center;color:#888;">No data found for this subject.</td></tr>`;
                if (subjectChartInst) subjectChartInst.destroy();
                return;
            }

            // Calc Entry for Subject if missing?
            // subjects.html has `candidatesEntry` calculated but doesn't explicitly save "entry" field in the root of data object?
            // Let's check subjects.html saveStructure.
            // It saves `grades: {}`. It does NOT seem to save a separate 'entry' field in the root object in the save code I read.
            // Wait, in `calc()` it updates `candidatesEntryEl`.
            // In safeCurrentSubject():
            // data = { subjectCode, ..., grades, currentMean, ... }
            // IT DOES NOT SAVE 'entry' count explicitly! 
            // We must calculate it from grades for the report.

            items.forEach(item => {
                // Determine entry from grades
                let entry = 0;
                if (item.grades) {
                    Object.values(item.grades).forEach(v => entry += (Number(v) || 0));
                }
                item.entry = entry;
            });

            items.forEach((item, idx) => {
                const tr = document.createElement('tr');
                // For subjects, keys are 'A', 'B' etc. so isSubject=true
                const gradeCells = gradeCols.map(g => `<td style="font-size:11px; padding:4px;">${getGrade(item, g, true)}</td>`).join('');

                tr.innerHTML = `
                    <td class="rank-col">${idx + 1}</td>
                    <td>${item.institution || item.Institution || 'Unknown'}</td>
                    <td class="score-col">${item.entry}</td>
                    <td class="score-col">${Number(item.currentMean).toFixed(4)}</td>
                    ${gradeCells}
                `;
                tbody.appendChild(tr);
            });

            // Chart
            const top10 = items.slice(0, 10);
            const ctx = document.getElementById('subjectChart').getContext('2d');

            if (subjectChartInst) subjectChartInst.destroy();

            subjectChartInst = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: top10.map(d => (d.institution || 'Unk').substring(0, 12)),
                    datasets: [{
                        label: 'Subject Mean',
                        data: top10.map(d => d.currentMean),
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#ddd' } },
                        x: { grid: { display: false }, ticks: { color: '#ccc', font: { size: 10 } } }
                    }
                }
            });
        }

        // Wait for Auth before init to prevent permission errors
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log("Auth confirmed, starting init...");
                init();
            } else {
                console.warn("No user found in analytics, waiting for redirect...");
            }
        });

        // Safety timeout for loader (10s)
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader && loader.style.display !== 'none') {
                loader.innerHTML += '<div style="color:red;margin-top:10px;">Taking longer than expected... Check console for errors.</div>';
                // Optional: Force hide
                // loader.style.display = 'none'; 
            }
        }, 10000);

    </script>
